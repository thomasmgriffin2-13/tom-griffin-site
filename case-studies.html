<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Studies · Tom Griffin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at top right, rgba(46, 139, 101, 0.11) 0%, transparent 55%),
        radial-gradient(ellipse at bottom left, rgba(59, 130, 246, 0.11) 0%, transparent 50%),
        #ffffff;
      background-attachment: fixed;
      color: #111;
      font-size: 16px;
      line-height: 1.6;
    }

    .content {
      background: transparent;
      max-width: 725px;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .top-bar-name {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #111;
    }

    .top-bar-contact {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
      font-size: 0.92rem;
      line-height: 1.3;
      text-align: right;
    }

    .top-bar-contact a {
      color: #111;
      text-decoration: none;
    }

    .top-bar-contact a:hover { text-decoration: underline; }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .site-nav-line {
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .site-nav-links {
      display: flex;
      gap: 1.75rem;
    }

    .site-nav-links a {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #999;
      text-decoration: none;
      padding-bottom: 0.5rem;
      position: relative;
    }

    .site-nav-links a:hover { color: #111; }

    .site-nav-links a.active { color: #111; }

    .site-nav-links a.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: #111;
    }

  </style>
</head>
<body>

  <div class="content">
    <header class="top-bar">
      <div class="top-bar-name">Tom Griffin</div>
      <div class="top-bar-contact">
        <a href="mailto:thomasmgriffin2@gmail.com">thomasmgriffin2@gmail.com</a>
        <a href="https://www.linkedin.com/in/thomas-griffin/" target="_blank">LinkedIn</a>
      </div>
    </header>

    <nav class="site-nav">
      <span class="site-nav-line"></span>
      <div class="site-nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="case-studies.html" class="active">Case Studies</a>
      </div>
      <span class="site-nav-line"></span>
    </nav>

  </div>

</body>
</html>
